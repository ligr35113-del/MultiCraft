name: Build Windows (playable zip)

# Ручний запуск: вкладка Actions -> "Build Windows (playable zip)" -> Run workflow
on:
  workflow_dispatch:

jobs:
  windows-build:
    name: "MSYS2-MinGW (64-bit)"
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-clang mingw-w64-x86_64-cmake mingw-w64-x86_64-autotools mingw-w64-x86_64-tcl git zip

      - name: Build
        run: |
          cd ./Windows
          ./Start.sh
          cmake --build . -j
          cd -
          strip -s ./bin/multicraft.exe

      # Збирає DLL, від яких залежить multicraft.exe (компілятор MinGW),
      # і кладе їх поруч з exe. Без цього гра не запускається
      # (код помилки -1073741515 = DLL not found).
      - name: Bundle required DLLs
        run: |
          echo "=== DLL, які імпортує multicraft.exe ==="
          objdump -p ./bin/multicraft.exe | grep "DLL Name" || true
          echo "=== Копіюю DLL з /mingw64 ==="
          ldd ./bin/multicraft.exe | grep -i "/mingw64/" | awk '{print $3}' | sort -u | while read f; do
            cp -v "$f" ./bin/
          done
          echo "=== Вміст bin ==="
          ls -la ./bin

      # Рушій містить лише тестову гру devtest. Для справжнього геймплею
      # додаємо Minetest Game (вільна ліцензія, LGPL/CC BY-SA).
      - name: Add a playable game
        run: |
          mkdir -p games
          git clone --depth 1 https://github.com/minetest/minetest_game games/minetest_game
          rm -rf games/minetest_game/.git

      - name: Create ZIP
        run: |
          mkdir MultiCraft
          cp -r ./bin MultiCraft/
          cp -r ./builtin MultiCraft/
          cp -r ./client MultiCraft/
          cp -r ./clientmods MultiCraft/
          cp -r ./fonts MultiCraft/
          cp -r ./games MultiCraft/
          cp -r ./mods MultiCraft/
          cp -r ./textures MultiCraft/
          [ -d ./locale ] && cp -r ./locale MultiCraft/ || true
          zip -r MultiCraft-Windows.zip MultiCraft

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiCraft-Windows
          path: MultiCraft-Windows.zip
